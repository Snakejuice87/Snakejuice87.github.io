<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.1">
<title>Simple Video Playlist Player</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

#player-container {
    max-width: 900px;
    margin: auto;
}

video {
    width: 100%;
    max-height: 480px;
    background: black;
}

#playlist, #playlist ul{
    list-style:none;
}

#playlist {
    margin-top: 15px;
    padding: 0;
    list-style: none;
    border: 1px solid #ccc;
    background: #fff;
}

#playlist li {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #e0e0e0;
    border-left: 1px solid #e0e0e0;
}

#playlist li:last-child {
    border-bottom: none;
}

#playlist li:hover:not(.season-header) {
    background: #f0f7ff;
}

#playlist li.active:not(.season-header) {
    background: #1976d2;
    color: #fff;
    font-weight: bold;
}

.season-header.active2{
    background-color:  white;
    text-decoration: underline;
    border: #1976d2 3px solid !important;
    color: #1976d2;
}
.season-header.notactive2{
    background-color: black;
    text-decoration: underline;
    border: white 3px solid !important;
    background:black;
    color: white;
}

.season-header{
    font-weight:bold;
    color: white;
    background: black;
    cursor:pointer;
    margin-top:8px;
}
.season-group {
    margin-left:10px;
}
.season-group.collapsed{
    display:none;
}
.active{
    background:black;
    color:white;
}
</style>
</head>

<body>

<div id="player-container">
    <video id="videoPlayer" playsinline webkit-playsinline controls></video>

    <ul id="playlist"></ul>
</div>

const videoPlayer = document.getElementById("videoPlayer");
const playlist = document.getElementById("playlist");

let currentIndex = 0;
const episodeLis = [];
const episodeGroups = [];
const episodeHeaders = []; // FIX: track header per episode

// ---- GROUP BY SEASON ----
const seasons = {};

videos.forEach((video,index)=>{
    const m = video.title.match(/S(\d{2})E(\d{2})/i);
    if(!m) return;

    const season = m[1];
    const ep = m[2];

    if(!seasons[season]) seasons[season]=[];
    seasons[season].push({ ...video, index, ep });
});

// ---- BUILD PLAYLIST ----
Object.keys(seasons).sort().forEach(season=>{

    const header = document.createElement("li");
    header.textContent = "Season " + season;
    header.className = "season-header notactive2";
    playlist.appendChild(header);

    const group = document.createElement("ul");
    group.className = "season-group collapsed";
    playlist.appendChild(group);

    header.addEventListener("click",()=>{
        group.classList.toggle("collapsed");
        syncHeaderState(header, group);
    });

    seasons[season]
        .sort((a,b)=>a.ep-b.ep)
        .forEach(video=>{

            const li = document.createElement("li");
            const cleanTitle = video.title.replace(/^.*?-\s*S\d{2}E\d{2}\s*-\s*/i,"");

            li.textContent = `E${video.ep} – ${cleanTitle}`;
            li.addEventListener("click",()=>playVideo(video.index));

            group.appendChild(li);

            episodeLis[video.index] = li;
            episodeGroups[video.index] = group;
            episodeHeaders[video.index] = header; // FIX
        });

    // ---- INITIAL HEADER STATE ----
    syncHeaderState(header, group);
});

// ---- SYNC HEADER CLASS ----
function syncHeaderState(header, group){
    if(group.classList.contains("collapsed")){
        header.classList.remove("active2");
        header.classList.add("notactive2");
    }else{
        header.classList.remove("notactive2");
        header.classList.add("active2");
    }
}

// ---- PLAY ----
function playVideo(index){
    currentIndex = index;
    videoPlayer.src = videos[index].url;
    videoPlayer.setAttribute('playsinline', '');
    videoPlayer.setAttribute('webkit-playsinline', '');
    videoPlayer.removeAttribute('muted');
    videoPlayer.play();

    expandSeason(index);
    updateActive();
}

// ---- AUTO EXPAND SEASON ----
function expandSeason(index){
    const group = episodeGroups[index];
    const header = episodeHeaders[index];

    if(group && group.classList.contains("collapsed")){
        group.classList.remove("collapsed");
    }

    if(header){
        header.classList.remove("notactive2");
        header.classList.add("active2");
    }
}

// ---- ACTIVE HIGHLIGHT ----
function updateActive(){
    episodeLis.forEach((li,i)=>{
        if(li) li.classList.toggle("active", i===currentIndex);
    });
}

// ---- AUTONEXT ----
videoPlayer.addEventListener("ended",()=>{
    currentIndex = (currentIndex+1)%videos.length;
    playVideo(currentIndex);
});

// ---- START ----
playVideo(0);
</script>
