<script>
(function () {
    "use strict";

    const audios = document.querySelectorAll("video");
    
     audios.forEach(function(audio) {
        audio.addEventListener("click", function () {
            let source = this.querySelector("source");
        if (!this.paused) {
            this.pause();
            console.log(source.src+" \n is Paused");
        } else {
            this.play();
            console.log(source.src+" \n is Playing");
        }
    });
});       

    for (const audio of audios) {
        // Set attributes
        audio.playsinline = true;
        audio.loop = true;
        // audio.muted = true;
        // audio.preload = true;
        audio.autoplay = false;

        audio.removeAttribute("controls", "");
        // audio.removeAttribute("loop");
        // audio.removeAttribute("muted");
        audio.removeAttribute("autoplay");
        audio.setAttribute('playsinline', '');
        audio.setAttribute('webkit-playsinline', '');

        // Fallback if loop property is not supported
        if (typeof audio.loop !== "boolean") {
            audio.addEventListener("ended", function () {
                this.currentTime = 0;
                this.play();
            }, true);
        }

        // Attempt playback
        audio.play().catch(() => {});
    }
})();
</script>


<script>
       // Pause playing video if another video is played
function onlyPlayOneIn(container) {
    container.addEventListener("play", function (event) {
        const audios = container.getElementsByTagName("video");

        for (let i = 0; i < audios.length; i++) {
            const audio = audios[i];
            if (audio !== event.target) {
            
                    if (!audio.paused) {
                          audio.pause();
                          
                audio.pause();
                audio.currentTime = 0;
                
            }
        }
    }, true); // use capture so it works on all audio elements
}

document.addEventListener("DOMContentLoaded", function () {
    onlyPlayOneIn(document.body);
});
</script>


<script>
document.querySelectorAll("video").forEach(video => {
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
});

document.addEventListener('fullscreenchange', exit);
document.addEventListener('webkitfullscreenchange', exit);

function exit() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    document.exitFullscreen?.();
    document.webkitExitFullscreen?.();
  }
}
</script>
